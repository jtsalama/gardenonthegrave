<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Garden on the Grave — WAUHAUS</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&family=DM+Mono:wght@300;400&display=swap');

  :root {
    --bg: #0c0c0a;
    --fg: #c8c2b4;
    --fg-dim: #5e5a50;
    --earth: #3a4a28;
    --earth-light: #6b7d4e;
    --soil: #2a2118;
    --bone: #d4c9a8;
    --serif: 'EB Garamond', Georgia, serif;
    --mono: 'DM Mono', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--serif);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  .fullscreen {
    position: fixed;
    inset: 0;
  }

  .artwork {
    position: absolute;
    inset: 0;
    z-index: 0;
  }

  .artwork img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: center top;
    display: block;
  }

  .artwork::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      linear-gradient(to bottom, transparent 40%, rgba(10,10,8,0.5) 55%, rgba(10,10,8,0.88) 75%, rgba(10,10,8,0.95) 100%);
    pointer-events: none;
  }

  .controls {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 3;
    padding: 0 1.4rem 3.5rem;
  }

  .title-block {
    padding-bottom: 0.8rem;
  }

  .title-block h1 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 1.2rem;
    letter-spacing: 0.05em;
    color: var(--fg);
    text-transform: lowercase;
  }

  .title-block .credit {
    font-family: var(--mono);
    font-weight: 300;
    font-size: 0.55rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--fg-dim);
    margin-top: 0.15rem;
  }

  .progress-wrap {
    width: 100%;
    height: 3px;
    background: rgba(255,255,255,0.1);
    cursor: pointer;
    border-radius: 1px;
    position: relative;
    touch-action: none;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--earth), var(--earth-light));
    width: 0%;
    border-radius: 1px;
    position: relative;
    transition: width 0.25s linear;
  }

  .progress-thumb {
    position: absolute;
    right: -5px; top: -4px;
    width: 11px; height: 11px;
    border-radius: 50%;
    background: var(--bone);
    opacity: 0;
    transition: opacity 0.2s;
    box-shadow: 0 0 6px rgba(0,0,0,0.5);
  }

  .progress-wrap:hover .progress-thumb,
  .progress-wrap:active .progress-thumb,
  .progress-wrap.touching .progress-thumb {
    opacity: 1;
  }

  .time-row {
    display: flex;
    justify-content: space-between;
    font-family: var(--mono);
    font-size: 0.55rem;
    color: rgba(200,194,180,0.5);
    margin-top: 0.4rem;
    letter-spacing: 0.04em;
  }

  .play-row {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.8rem;
    padding: 0.8rem 0 0.2rem;
  }

  .play-btn {
    width: 62px; height: 62px;
    border-radius: 50%;
    border: 1.5px solid rgba(200,194,180,0.3);
    background: rgba(12,12,10,0.4);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: var(--fg);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.25s ease;
    -webkit-appearance: none;
  }

  .play-btn:active { transform: scale(0.93); }

  .play-btn.playing {
    border-color: var(--earth-light);
    box-shadow: 0 0 20px rgba(107,125,78,0.2);
  }

  .play-btn svg { width: 22px; height: 22px; fill: var(--fg); }

  .status {
    display: flex;
    align-items: center;
    gap: 0.3rem;
    font-family: var(--mono);
    font-size: 0.5rem;
    color: var(--fg-dim);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .status-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--fg-dim);
    transition: background 0.3s;
  }

  .status-dot.on { background: var(--earth-light); }

  .lang-row {
    display: flex;
    gap: 0.25rem;
  }

  .lang-btn {
    font-family: var(--mono);
    font-size: 0.55rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 0.25rem 0.6rem;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 2px;
    background: rgba(12,12,10,0.4);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: var(--fg-dim);
    cursor: pointer;
    transition: all 0.2s;
    -webkit-appearance: none;
  }

  .lang-btn.active {
    color: var(--bone);
    border-color: var(--earth);
    background: rgba(58,74,40,0.3);
  }

  .lock-screen {
    position: absolute;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
    background: var(--bg);
  }

  .lock-screen h1 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 1.6rem;
    letter-spacing: 0.05em;
    text-transform: lowercase;
    margin-bottom: 0.8rem;
  }

  .lock-screen .next {
    font-family: var(--mono);
    font-weight: 300;
    font-size: 0.7rem;
    color: var(--fg-dim);
    letter-spacing: 0.06em;
    line-height: 1.7;
  }

  .lock-screen .next span { color: var(--earth-light); }

  .hidden { display: none !important; }

  @supports (padding-bottom: env(safe-area-inset-bottom)) {
    .controls { padding-bottom: calc(3.5rem + env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body>

<div class="fullscreen">

  <div class="lock-screen hidden" id="lockScreen">
    <h1>garden on the grave</h1>
    <p class="next">next broadcast<br><span id="nextTime"></span></p>
  </div>

  <div class="artwork">
    <img src="cover.jpg" alt="Garden on the Grave">
  </div>

  <div class="controls">
    <div class="title-block">
      <h1>garden on the grave</h1>
      <div class="credit">wauhaus</div>
    </div>

    <div class="progress-wrap" id="pw">
      <div class="progress-fill" id="pf"><div class="progress-thumb"></div></div>
    </div>
    <div class="time-row">
      <span id="tC">0:00</span>
      <span id="tD">0:00</span>
    </div>

    <div class="play-row">
      <button class="play-btn" id="pb" aria-label="Play">
        <svg id="iP" viewBox="0 0 24 24"><polygon points="7,3 21,12 7,21"/></svg>
        <svg id="iS" class="hidden" viewBox="0 0 24 24"><rect x="5" y="3" width="4" height="18"/><rect x="15" y="3" width="4" height="18"/></svg>
      </button>

      <div class="lang-row" id="lr"></div>

      <div class="status">
        <div class="status-dot" id="sd"></div>
        <span id="st">ready</span>
      </div>
    </div>
  </div>
</div>

<script>
// ============================================================
// CONFIG — TEMPORARY TEST SETUP, revert before the show
// Two entries labelled MP3 / AAC: the button label is the key itself,
// so the language switcher doubles as an A/B codec comparison.
// Both are the same Copenhagen master, so switching mid-playback
// compares the same passage at the same moment.
// ============================================================
const CONFIG = {
  languages: {
    'MP3': [
      'https://pub-0f1058e036ee41378ed0676e2e2cf889.r2.dev/audio.mp3',
      'https://github.com/jtsalama/gardenonthegrave/releases/download/v1/audio.mp3',
    ],
    'AAC': [
      'https://pub-0f1058e036ee41378ed0676e2e2cf889.r2.dev/gotg-aac160.m4a',
      'https://github.com/jtsalama/gardenonthegrave/releases/download/v2/gotg-aac160.m4a',
    ],
    // For the show, replace both with:
    // 'EN': ['<r2>/riga-en.m4a', '<github v2>/riga-en.m4a'],
    // 'LV': ['<r2>/riga-lv.m4a', '<github v2>/riga-lv.m4a'],
  },
  defaultLang: 'MP3',

  // Scheduled sync test: Thursday 30 July 2026, 14:35 Helsinki (= Riga, UTC+03:00).
  // Window runs 14:35:00 - 15:38:32 (start + durationFallback).
  // Outside it the lock screen shows and playback is blocked.
  // Set back to null for on-demand listening.
  broadcasts: [
    { start: '2026-07-30T14:35:00+03:00' },
  ],

  // Total audio length in seconds, preroll included once there is one.
  // Used before metadata loads, and to compute the end of a broadcast window.
  durationFallback: 3812,
};

// ============================================================
const $ = id => document.getElementById(id);
let audios = {}, lang = CONFIG.defaultLang, on = false, drag = false;
let activeBroadcast = null;
let sourceIndex = {};
let dead = false, retryTimer = null;   // all sources failed; waiting for a way back
let waitTimer = null;                  // playback stalled for lack of data

// Lang buttons
const keys = Object.keys(CONFIG.languages);
if (keys.length > 1) keys.forEach(l => {
  const b = document.createElement('button');
  b.className = 'lang-btn' + (l === lang ? ' active' : '');
  b.textContent = l; b.dataset.l = l;
  b.onclick = () => { unlockAll(); langSwitch(l); };  // this tap counts as a gesture too
  $('lr').appendChild(b);
});
else $('lr').style.display = 'none';

// FIX #6: set preload correctly from the start, not overridden after
function makeAudio(l, url) {
  const a = new Audio();
  a.preload = (l === lang) ? 'auto' : 'none';
  a.disableRemotePlayback = true; // no Cast button, no nearby-devices/Bluetooth scan prompt
  a.src = url;
  a.addEventListener('loadedmetadata', () => {
    if (Math.abs(a.duration - CONFIG.durationFallback) > 2) {
      console.warn('Duration mismatch: audio is ' + Math.round(a.duration) + 's, durationFallback is ' + CONFIG.durationFallback + 's — update CONFIG.');
    }
  });
  a.addEventListener('ended', () => {
    pa('transmission complete'); $('pf').style.width = '100%';
  });
  a.addEventListener('error', () => {
    if (a !== audios[l]) return;      // stale element from an earlier source, ignore
    if (l !== lang) return;           // a language nobody is listening to must not kill the UI
    if (!tryFallback(l)) giveUp();
  });
  // 'waiting' is the browser saying outright that playback has stalled for lack of data. This
  // is what actually catches a dropout in Firefox: it fires no 'error' there, and it keeps
  // readyState high because the position it is stuck on does have data. If nothing resumes
  // within ten seconds, hand it to the recovery path.
  a.addEventListener('waiting', () => {
    if (a !== audios[l] || l !== lang || !on || dead) return;
    clearTimeout(waitTimer);
    // An element that has never played is simply still loading, and Firefox is slow at it.
    // Only give up quickly on something that was already running and then stopped.
    waitTimer = setTimeout(() => {
      if (a === audios[l] && l === lang && on && !dead) giveUp();
    }, a.dataset.started ? 10000 : 30000);
  });
  a.addEventListener('playing', () => {
    a.dataset.started = '1';
    clearTimeout(waitTimer);
  });
  return a;
}

Object.entries(CONFIG.languages).forEach(([l, urls]) => {
  sourceIndex[l] = 0;
  audios[l] = makeAudio(l, Array.isArray(urls) ? urls[0] : urls);
});

// Rebuild the element for language l on source index i, keeping position and play state.
// Used both for falling back to the next source and for recovering from a dead state.
function switchSource(l, i) {
  const urls = CONFIG.languages[l];
  sourceIndex[l] = i;
  const wasPlaying = on;
  const pos = activeBroadcast ? getTargetTime() : audios[l].currentTime;
  audios[l].pause();
  audios[l].src = '';
  audios[l].load();                                  // release the old element
  audios[l] = makeAudio(l, Array.isArray(urls) ? urls[i] : urls);
  $('st').textContent = 'reconnecting';
  audios[l].addEventListener('canplay', function () {
    if (audios[l] !== this) return;                  // superseded while loading
    revived();
    setTimeSafe(this, activeBroadcast ? getTargetTime() : pos);
    this.muted = false;
    if (wasPlaying) {
      this.play().then(() => {
        on = true;
        $('pb').classList.add('playing');
        $('iP').classList.add('hidden');
        $('iS').classList.remove('hidden');
        $('sd').classList.add('on');
        $('st').textContent = activeBroadcast ? 'live' : 'playing';
      }).catch(() => { $('st').textContent = 'tap to play'; });
    } else {
      $('st').textContent = 'ready';
    }
  }, { once: true });
  // Same nudge as in langSwitch: Firefox fetches nothing for an element it has not been told
  // to play, so waiting for 'canplay' alone left recovery stuck on "reconnecting" forever.
  if (wasPlaying) {
    audios[l].muted = true;
    const p = audios[l].play();
    if (p && p.catch) p.catch(() => {});
  }
}

function tryFallback(l) {
  const urls = CONFIG.languages[l];
  if (!Array.isArray(urls)) return false;
  const next = sourceIndex[l] + 1;
  if (next >= urls.length) return false;
  switchSource(l, next);
  return true;
}

// Every source failed. Without this the player used to stay dead until a manual reload,
// which in a cemetery means the listener is out of the performance for good.
function giveUp() {
  dead = true;
  on = false;
  $('pb').classList.remove('playing');
  $('iP').classList.remove('hidden');
  $('iS').classList.add('hidden');
  $('sd').classList.remove('on');
  $('st').textContent = navigator.onLine ? 'connection lost' : 'offline';
  if (!retryTimer) retryTimer = setInterval(retry, 5000);
}

function revived() {
  dead = false;
  if (retryTimer) { clearInterval(retryTimer); retryTimer = null; }
}

// Start over from the primary source. Called on a timer, on 'online', and from the play button.
function retry() {
  if (!dead) return;
  // No navigator.onLine check: iOS reports it unreliably, and a refused retry leaves the
  // listener in silence while a failed one costs nothing.
  switchSource(lang, 0);
}

window.addEventListener('online', () => retry());

const c = () => audios[lang];
const dur = () =>
  isFinite(c().duration) && c().duration > 0
    ? c().duration
    : CONFIG.durationFallback;

// iOS only lets an element play if the call comes straight out of a user gesture. Everything
// that starts playback later — switching language once loaded, recovering when the network
// returns — would be refused there. So on the very first tap, give every language a token
// play/pause inside the gesture. After that the browser considers them unlocked and later
// programmatic starts are allowed.
let unlocked = false;
function unlockAll() {
  if (unlocked) return;
  unlocked = true;
  Object.values(audios).forEach(a => {
    if (a === c()) return;                   // the active one is about to play for real
    // Start fetching the other language too. This costs a few MB that most listeners never
    // use, but it buys more than speed: a switch no longer depends on a download succeeding
    // at the exact moment someone taps the button in the middle of a cemetery.
    a.preload = 'auto';
    const p = a.play();
    if (p && p.then) p.then(() => a.pause()).catch(() => {});
  });
}

$('pb').onclick = () => {
  unlockAll();
  if (dead) { retry(); return; }
  on ? pa() : pl();
};

function getTargetTime() {
  if (!activeBroadcast) return 0;
  const elapsed = (Date.now() - activeBroadcast.start.getTime()) / 1000;
  return Math.max(0, Math.min(elapsed, dur()));
}

function pl() {
  const a = c();
  if (activeBroadcast) {
    const target = getTargetTime();
    if (target >= dur()) { $('st').textContent = 'transmission complete'; return; }
    a.currentTime = target;
  }
  a.play().then(() => {
    on = true;
    $('pb').classList.add('playing');
    $('iP').classList.add('hidden');
    $('iS').classList.remove('hidden');
    $('sd').classList.add('on');
    $('st').textContent = activeBroadcast ? 'live' : 'playing';
  }).catch(() => {
    $('st').textContent = 'tap to play';
  });
}

function pa(status = 'paused') {
  c().pause(); on = false;
  $('pb').classList.remove('playing');
  $('iP').classList.remove('hidden');
  $('iS').classList.add('hidden');
  $('sd').classList.remove('on');
  $('st').textContent = status;
}

// FIX A: safe currentTime assignment — waits for metadata if not yet loaded
function setTimeSafe(audio, time) {
  if (audio.readyState >= 1) {
    audio.currentTime = time;
  } else {
    audio.addEventListener('loadedmetadata', function handler() {
      audio.removeEventListener('loadedmetadata', handler);
      audio.currentTime = time;
    }, { once: true });
  }
}

function langSwitch(l) {
  if (l === lang) return;
  const t = activeBroadcast ? getTargetTime() : c().currentTime;
  const w = on;
  c().pause(); lang = l;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.l === l));

  const a = audios[l];
  if (a.preload !== 'auto') {
    a.preload = 'auto';
    a.load(); // force iOS Safari to fetch metadata even when paused
  }

  // Seek and start only once the element can actually play. The old code called play()
  // immediately after load(), on an element that had no data yet. Chrome tolerates that and
  // waits; Firefox does not, which is why switching to a language that had never been loaded
  // silently did nothing there. If the data never arrives, the starvation watch in tick()
  // notices and hands it to the recovery path.
  const begin = () => {
    setTimeSafe(a, activeBroadcast ? getTargetTime() : t);
    a.muted = false;
    if (!w) { $('st').textContent = 'ready'; return; }
    a.play().then(() => {
      on = true;
      $('pb').classList.add('playing');
      $('iP').classList.add('hidden');
      $('iS').classList.remove('hidden');
      $('sd').classList.add('on');
      $('st').textContent = activeBroadcast ? 'live' : 'playing';
    }).catch(() => {
      on = false;
      $('pb').classList.remove('playing');
      $('iP').classList.remove('hidden');
      $('iS').classList.add('hidden');
      $('sd').classList.remove('on');
      $('st').textContent = 'tap to play';
    });
  };

  if (a.readyState >= 3) begin();
  else {
    if (w) $('st').textContent = 'loading';
    a.addEventListener('canplay', begin, { once: true });
    // Firefox fetches nothing for an element it has not been told to play, so waiting for
    // 'canplay' before calling play() deadlocked: each was waiting for the other, and the
    // switch simply hung. Start it muted so the fetch begins immediately; begin() sets the
    // real position and unmutes once there is data.
    if (w) {
      a.muted = true;
      const p = a.play();
      if (p && p.catch) p.catch(() => {});
    }
  }
}

function fmt(s) {
  if (!isFinite(s)) return '0:00';
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sc = Math.floor(s%60);
  return h > 0 ? h+':'+String(m).padStart(2,'0')+':'+String(sc).padStart(2,'0') : m+':'+String(sc).padStart(2,'0');
}

let lastSync = 0;
let ticking = false;
let starvedAt = 0;
function tick() {
  if (ticking) return;
  ticking = true;
  const loop = () => {
    const a = c(), d = dur();
    if (!document.hidden && d > 0 && !drag) {
      $('pf').style.width = (a.currentTime / d * 100) + '%';
      $('tC').textContent = fmt(a.currentTime);
      $('tD').textContent = fmt(d);
    }
    // (Stall detection lives on the 'waiting' event in makeAudio. A readyState watch used to
    // sit here as well, but it could not tell a first load from a dropout and declared the
    // connection lost while a language was still perfectly normally loading.)
    if (on && activeBroadcast && Date.now() - lastSync > 15000) {
      const target = getTargetTime();
      if (Math.abs(a.currentTime - target) > 1.5) a.currentTime = target;
      lastSync = Date.now();
    }
    if (document.hidden) {
      setTimeout(loop, 1000);
    } else {
      requestAnimationFrame(loop);
    }
  };
  loop();
}
tick();

function sk(e) {
  if (activeBroadcast) return;
  const r = $('pw').getBoundingClientRect();
  const x = e.touches ? e.touches[0].clientX : e.clientX;
  const p = Math.max(0, Math.min(1, (x-r.left)/r.width));
  const a = c();
  if (a.duration) {
    a.currentTime = p * a.duration;
    Object.values(audios).forEach(el => { if (el !== a && el.readyState >= 1) el.currentTime = a.currentTime; }); // FIX B: skip unloaded audio elements
    $('pf').style.width = (p*100)+'%';
  }
}

$('pw').addEventListener('mousedown', e => { if (!activeBroadcast) drag=true; sk(e); }); // FIX C: don't set drag in broadcast mode
$('pw').addEventListener('touchstart', e => { if (!activeBroadcast) { drag=true; $('pw').classList.add('touching'); } sk(e); }, {passive:true});
document.addEventListener('mousemove', e => { if(drag) sk(e); });
document.addEventListener('touchmove', e => { if(drag) sk(e); }, {passive:true});
document.addEventListener('mouseup', () => { drag=false; });
document.addEventListener('touchend', () => { drag=false; $('pw').classList.remove('touching'); });
document.addEventListener('touchcancel', () => { drag=false; $('pw').classList.remove('touching'); });

function chk() {
  if (!CONFIG.broadcasts) { $('lockScreen').classList.add('hidden'); activeBroadcast = null; return; }
  const now = new Date(), d = dur();
  let found = null;
  for (const b of CONFIG.broadcasts) {
    const s = new Date(b.start), e = new Date(s.getTime() + d * 1000);
    if (now >= s && now <= e) { found = { start: s, end: e }; break; }
  }
  if (found) { activeBroadcast = found; $('lockScreen').classList.add('hidden'); }
  else {
    activeBroadcast = null; $('lockScreen').classList.remove('hidden');
    if (on) pa();
    const future = CONFIG.broadcasts.map(b => new Date(b.start)).filter(s => s > now).sort((a,b) => a-b);
    $('nextTime').textContent = future.length
      ? future[0].toLocaleDateString(undefined, { weekday:'long', day:'numeric', month:'long', hour:'2-digit', minute:'2-digit' })
      : 'no upcoming broadcasts';
  }
}
if (CONFIG.broadcasts) {
  chk();
  setInterval(chk, 5000);
}

if ('mediaSession' in navigator) {
  navigator.mediaSession.metadata = new MediaMetadata({
    title: 'Garden on the Grave', artist: 'WAUHAUS', album: 'Garden on the Grave',
    artwork: [{ src: 'cover.jpg', sizes: '512x512', type: 'image/jpeg' }]
  });
  // Wrap the handlers: Media Session calls them with a details object, and pa()'s first
  // parameter is the status text, so passing it straight through corrupts the status line.
  navigator.mediaSession.setActionHandler('play', () => { dead ? retry() : pl(); });
  navigator.mediaSession.setActionHandler('pause', () => pa());
  navigator.mediaSession.setActionHandler('stop', () => pa());

  // Claim the seek actions too. Without handlers the OS scrubs the element directly, which
  // let the lock screen skip past the broadcast lock that the in-page bar refuses.
  const snapBack = () => {
    const t = getTargetTime();
    if (Math.abs(c().currentTime - t) > 1.5) c().currentTime = t;
  };
  const seekHandlers = {
    seekto: d => { if (activeBroadcast) return snapBack();
                   if (d && d.seekTime != null) c().currentTime = d.seekTime; },
    seekbackward: d => { if (activeBroadcast) return snapBack();
                         c().currentTime = Math.max(0, c().currentTime - ((d && d.seekOffset) || 10)); },
    seekforward: d => { if (activeBroadcast) return snapBack();
                        c().currentTime = Math.min(dur(), c().currentTime + ((d && d.seekOffset) || 10)); },
    previoustrack: () => { if (activeBroadcast) return snapBack(); c().currentTime = 0; },
    nexttrack: () => { if (activeBroadcast) return snapBack(); },
  };
  Object.entries(seekHandlers).forEach(([action, fn]) => {
    try { navigator.mediaSession.setActionHandler(action, fn); } catch (e) {}
  });
}

// FIX #2: relative path works outside root too
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}

// No audio pre-caching. Downloading the whole file alongside the stream doubled every
// listener's data, competed with the stream on exactly the weak connections it was meant to
// protect, and only ever completed on a connection good enough not to need it. The media
// element's own buffer plus automatic recovery covers real dropouts instead.

// Resync to broadcast time when screen wakes up — covers any drift
// accumulated while JS was throttled in the background.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && on && activeBroadcast) {
    const target = getTargetTime();
    if (Math.abs(c().currentTime - target) > 1.5) c().currentTime = target;
    lastSync = Date.now();
  }
});
</script>
</body>
</html>
